<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibration Analyzer v2 — System Architecture</title>
<style>
  body { font-family: system-ui, sans-serif; background: #fff; margin: 2rem; }
  h2 { font-size: 1rem; color: #333; margin-bottom: 1.5rem; }
  svg text { font-family: system-ui, sans-serif; }
</style>
</head>
<body>
<h2>Vibration Analyzer v2 — STM32F401 + ESP32 Dual-Chip Architecture</h2>
<svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- MPU-6050 -->
  <rect x="20" y="160" width="110" height="80" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <text x="75" y="191" text-anchor="middle" font-size="12" font-weight="600" fill="#0C447C">MPU-6050</text>
  <text x="75" y="208" text-anchor="middle" font-size="10" fill="#185FA5">MEMS accel</text>
  <text x="75" y="222" text-anchor="middle" font-size="10" fill="#185FA5">±2g · 0x68</text>

  <!-- I2C arrow -->
  <line x1="130" y1="200" x2="158" y2="200" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="144" y="193" text-anchor="middle" font-size="10" fill="#888">I2C</text>

  <!-- STM32 outer -->
  <rect x="160" y="60" width="210" height="290" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1.5"/>
  <text x="265" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#27500A">STM32F401</text>
  <text x="265" y="104" text-anchor="middle" font-size="10" fill="#3B6D11">ARM Cortex-M4 · 84 MHz</text>

  <!-- STM32 steps -->
  <rect x="178" y="118" width="174" height="30" rx="5" fill="#C0DD97" stroke="#639922" stroke-width="0.5"/>
  <text x="265" y="137" text-anchor="middle" font-size="11" fill="#27500A">Sample 1024 pts @ 1 kHz</text>

  <line x1="265" y1="148" x2="265" y2="160" stroke="#3B6D11" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="178" y="160" width="174" height="30" rx="5" fill="#C0DD97" stroke="#639922" stroke-width="0.5"/>
  <text x="265" y="179" text-anchor="middle" font-size="11" fill="#27500A">Hamming window</text>

  <line x1="265" y1="190" x2="265" y2="202" stroke="#3B6D11" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="178" y="202" width="174" height="30" rx="5" fill="#C0DD97" stroke="#639922" stroke-width="0.5"/>
  <text x="265" y="221" text-anchor="middle" font-size="11" fill="#27500A">CMSIS-DSP FFT (1024-pt)</text>

  <line x1="265" y1="232" x2="265" y2="244" stroke="#3B6D11" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="178" y="244" width="174" height="30" rx="5" fill="#C0DD97" stroke="#639922" stroke-width="0.5"/>
  <text x="265" y="263" text-anchor="middle" font-size="11" fill="#27500A">Fault detect + UART TX</text>

  <!-- UART format -->
  <rect x="178" y="306" width="174" height="24" rx="4" fill="#ddd" stroke="#aaa" stroke-width="0.5"/>
  <text x="265" y="322" text-anchor="middle" font-size="10" fill="#444">FREQ:73.24,MAG:0.38,FAULT:1</text>
  <line x1="265" y1="274" x2="265" y2="306" stroke="#aaa" stroke-width="0.8" stroke-dasharray="3 2"/>

  <!-- UART arrow -->
  <line x1="370" y1="259" x2="398" y2="259" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="384" y="250" text-anchor="middle" font-size="10" fill="#888">UART</text>
  <text x="384" y="268" text-anchor="middle" font-size="10" fill="#888">115200</text>

  <!-- ESP32 outer -->
  <rect x="400" y="100" width="200" height="218" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
  <text x="500" y="126" text-anchor="middle" font-size="13" font-weight="600" fill="#633806">ESP32 DevKit</text>
  <text x="500" y="142" text-anchor="middle" font-size="10" fill="#854F0B">CP2102 · GPIO16=RX</text>

  <!-- ESP32 steps -->
  <rect x="418" y="156" width="164" height="30" rx="5" fill="#FDDDA0" stroke="#BA7517" stroke-width="0.5"/>
  <text x="500" y="175" text-anchor="middle" font-size="11" fill="#633806">UART RX + parse</text>

  <line x1="500" y1="186" x2="500" y2="198" stroke="#BA7517" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="418" y="198" width="164" height="30" rx="5" fill="#FDDDA0" stroke="#BA7517" stroke-width="0.5"/>
  <text x="500" y="217" text-anchor="middle" font-size="11" fill="#633806">HTTP server · port 80</text>

  <line x1="500" y1="228" x2="500" y2="240" stroke="#BA7517" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="418" y="240" width="164" height="30" rx="5" fill="#FDDDA0" stroke="#BA7517" stroke-width="0.5"/>
  <text x="500" y="259" text-anchor="middle" font-size="11" fill="#633806">Live dashboard + alarm</text>

  <!-- Wi-Fi arrow -->
  <line x1="600" y1="215" x2="634" y2="215" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="617" y="207" text-anchor="middle" font-size="10" fill="#888">Wi-Fi</text>
  <text x="617" y="224" text-anchor="middle" font-size="10" fill="#888">LAN</text>

  <!-- Browser -->
  <rect x="636" y="175" width="30" height="80" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="651" y="222" text-anchor="middle" font-size="10" fill="#3C3489" transform="rotate(-90 651 215)">browser</text>

  <!-- Bottom note -->
  <text x="340" y="390" text-anchor="middle" font-size="10" fill="#888">No cloud · any device on LAN · 2s refresh · STM32 handles all DSP · ESP32 = display node only</text>
  <text x="340" y="406" text-anchor="middle" font-size="10" fill="#888">UART format: "FREQ:73.24,MAG:0.3841,FAULT:1\n" · 115200 baud · PA2→GPIO16</text>
</svg>
</body>
</html>
